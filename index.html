<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
:root{
  --bg:#06050e;--gold:#c9a96e;--gold-s:#e8cfa0;--rose:#e8738a;--rose-s:#f4a7b5;
  --white:#f5f0eb;--dim:rgba(245,240,235,.5);--glass:rgba(255,255,255,.042);
  --glass-b:rgba(255,255,255,.09);--e-out:cubic-bezier(.16,1,.3,1);
  --fs-giant:clamp(2.5rem,10vw,5.2rem);--fs-hero:clamp(1.75rem,7vw,3.4rem);
  --fs-body:clamp(.9rem,3.7vw,1rem);--fs-small:clamp(.7rem,2.9vw,.82rem);
  --fs-tiny:clamp(.58rem,2.4vw,.67rem);
}
body{background:var(--bg);color:var(--white);font-family:'Raleway',sans-serif;font-weight:300;
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
  min-height:100dvh;overflow-x:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
body::after{content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
  background-size:150px;pointer-events:none;z-index:1;opacity:.3;}
#particles-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;}

/* ── SECRET SCREEN ─────────────────────────── */
#secret-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--bg);
  padding:clamp(1.4rem,5vw,3rem) clamp(1.2rem,5vw,2rem);text-align:center;overflow:hidden;}
.secret-glow{position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 45% at 50% 65%,rgba(232,115,138,.14) 0%,transparent 70%),
    radial-gradient(ellipse 50% 55% at 25% 20%,rgba(201,169,110,.08) 0%,transparent 60%);
  pointer-events:none;}
.secret-lock{width:50px;height:50px;margin-bottom:clamp(1.2rem,4.5vw,2.2rem);
  animation:float 4s ease-in-out infinite;flex-shrink:0;}
.secret-lock svg{width:100%;height:100%}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.secret-eyebrow{font-size:var(--fs-tiny);font-weight:400;letter-spacing:.15em;
  text-transform:uppercase;color:var(--gold);margin-bottom:clamp(.6rem,2.5vw,1.1rem);opacity:.8;}
.secret-title{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,8vw,3.6rem);
  font-weight:500;font-style:italic;line-height:1.2;color:var(--white);
  margin-bottom:clamp(.4rem,1.6vw,.8rem);}
.secret-sub{font-size:var(--fs-body);color:var(--dim);letter-spacing:.06em;
  margin-bottom:clamp(1.6rem,6vw,2.8rem);max-width:290px;line-height:1.65;}
#countdown{display:flex;gap:clamp(.38rem,1.5vw,.95rem);align-items:center;
  justify-content:center;width:100%;max-width:min(330px,90vw);}
.cd-item{display:flex;flex-direction:column;align-items:center;gap:.25rem;flex:1;min-width:0;}
.cd-num{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,6.2vw,2.9rem);
  font-weight:500;line-height:1;color:var(--white);background:var(--glass);
  border:1px solid var(--glass-b);border-radius:9px;width:100%;aspect-ratio:1;max-width:66px;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.cd-label{font-size:clamp(.48rem,1.9vw,.58rem);letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);opacity:.7;white-space:nowrap;}
.cd-sep{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,5vw,2.4rem);
  font-weight:500;color:var(--dim);line-height:1;flex-shrink:0;margin-bottom:1.2em;}

/* ── MAIN CONTENT ──────────────────────────── */
#main-content{position:relative;z-index:2;display:none;flex-direction:column;min-height:100dvh;}
#main-content.visible{display:flex}

/* ── HERO ──────────────────────────────────── */
#hero{position:relative;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:clamp(2.5rem,8vw,5rem) clamp(1.2rem,5vw,2.5rem) clamp(3rem,8vw,5rem);
  text-align:center;overflow:hidden;}
.hero-glow{position:absolute;inset:0;
  background:radial-gradient(ellipse 90% 50% at 50% 20%,rgba(232,115,138,.18) 0%,transparent 65%),
    radial-gradient(ellipse 60% 60% at 88% 88%,rgba(201,169,110,.1) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 8% 55%,rgba(232,115,138,.07) 0%,transparent 50%);
  pointer-events:none;}

/* Banner — portrait crop */
.banner-wrap{width:min(320px,78vw);margin-bottom:clamp(1.4rem,5vw,2.4rem);
  animation:fade-up .9s var(--e-out) .2s both;}
.banner-frame{position:relative;border-radius:14px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(201,169,110,.25),0 0 40px rgba(232,115,138,.22),
    0 20px 50px rgba(0,0,0,.65);}
.banner-frame img{width:100%;display:block;border-radius:14px;}
.banner-frame::after{content:'';position:absolute;inset:0;border-radius:14px;
  border:1px solid rgba(201,169,110,.3);pointer-events:none;}

.hero-eyebrow{font-size:var(--fs-tiny);font-weight:400;letter-spacing:.15em;
  text-transform:uppercase;color:var(--gold);
  margin-bottom:clamp(.5rem,2vw,.9rem);animation:fade-up .8s var(--e-out) .4s both;}
.hero-title{font-family:'Playfair Display',serif;font-size:var(--fs-giant);font-weight:500;
  line-height:1.1;color:var(--white);margin-bottom:clamp(.4rem,1.6vw,.75rem);
  animation:fade-up .9s var(--e-out) .5s both;}
.hero-title em{font-style:italic;color:var(--gold-s)}
.hero-title .line-rose{display:block;color:var(--rose-s);font-style:italic}
.hero-sub{font-size:var(--fs-body);color:var(--dim);letter-spacing:.05em;line-height:1.75;
  max-width:min(330px,88vw);margin-bottom:clamp(1.5rem,5vw,2.6rem);
  animation:fade-up .9s var(--e-out) .62s both;}
.ornament{display:flex;align-items:center;gap:.75rem;margin-bottom:clamp(1.3rem,4.5vw,2.6rem);
  animation:fade-up .8s var(--e-out) .74s both;}
.ornament-line{width:34px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,110,.5));}
.ornament-line.r{transform:scaleX(-1)}
.ornament-diamond{width:5px;height:5px;border:1px solid var(--gold);transform:rotate(45deg);}
.ask-label{font-size:var(--fs-tiny);letter-spacing:.08em;color:var(--dim);
  margin-bottom:clamp(.9rem,3.5vw,1.7rem);text-transform:uppercase;opacity:.55;
  animation:fade-up .8s var(--e-out) .84s both;}

/* ── BUTTONS ────────────────────────────────── */
.btn-wrap{display:flex;align-items:center;justify-content:center;
  gap:clamp(.8rem,3vw,1.4rem);flex-wrap:nowrap;
  animation:fade-up .9s var(--e-out) .9s both;min-height:clamp(48px,12vw,64px);}
.btn{font-family:'Raleway',sans-serif;font-size:clamp(.72rem,3vw,.8rem);font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;border:none;border-radius:50px;
  padding:clamp(.8rem,3.3vw,1rem) clamp(1.7rem,6.2vw,2.6rem);cursor:pointer;
  position:relative;overflow:hidden;white-space:nowrap;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .22s var(--e-out),box-shadow .22s;}
.btn::before{content:'';position:absolute;inset:0;border-radius:inherit;opacity:0;
  transition:opacity .22s;background:rgba(255,255,255,.08);pointer-events:none;}
.btn:hover::before,.btn:active::before{opacity:1}
.btn-yes{background:linear-gradient(135deg,#c9a96e,#e8cfa0,#c9a96e);background-size:200%;
  color:#1a1205;box-shadow:0 0 28px rgba(201,169,110,.38),0 4px 18px rgba(0,0,0,.4);
  animation:shimmer 4s linear infinite, fade-up .9s var(--e-out) .9s both;}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.btn-yes:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 44px rgba(201,169,110,.52),0 6px 22px rgba(0,0,0,.5)}
.btn-yes:active{transform:scale(.96)}
.btn-no{background:transparent;color:var(--dim);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 3px 14px rgba(0,0,0,.3);
  transition:transform .2s var(--e-out),box-shadow .2s,color .2s,border-color .2s,
    left .26s var(--e-out),top .26s var(--e-out);}
.btn-no:hover{border-color:rgba(255,255,255,.24);color:var(--white)}
.btn-no.fleeing{position:fixed;z-index:200;pointer-events:auto;
  transition:left .26s var(--e-out),top .26s var(--e-out);}

/* ── CELEBRATION ────────────────────────────── */
#celebration{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;
  align-items:center;justify-content:flex-start;text-align:center;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:rgba(6,5,14,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
#celebration.active{display:flex}
.celeb-inner{display:flex;flex-direction:column;align-items:center;width:100%;
  padding:clamp(2.5rem,8vw,4rem) clamp(1.2rem,5vw,2rem) clamp(2.5rem,8vw,4rem);
  min-height:100%;justify-content:center;}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:1;}
.celeb-glow{position:fixed;inset:0;
  background:radial-gradient(ellipse 70% 55% at 50% 35%,rgba(232,115,138,.24) 0%,transparent 65%),
    radial-gradient(ellipse 45% 45% at 15% 75%,rgba(201,169,110,.15) 0%,transparent 55%);
  pointer-events:none;z-index:0;}
.celeb-hearts{font-size:clamp(2rem,7vw,2.7rem);margin-bottom:clamp(1rem,4vw,1.4rem);
  animation:pop .6s var(--e-out);position:relative;z-index:2;}
@keyframes pop{from{transform:scale(0) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.celeb-title{font-family:'Playfair Display',serif;font-size:var(--fs-hero);font-weight:500;
  font-style:italic;color:var(--white);line-height:1.22;
  margin-bottom:clamp(.7rem,2.8vw,1.1rem);animation:fade-up .8s var(--e-out) .2s both;
  white-space:pre-line;position:relative;z-index:2;padding:0 .4rem;}
.celeb-sub{font-size:var(--fs-body);letter-spacing:.07em;color:var(--dim);
  margin-bottom:clamp(1.8rem,6.5vw,2.8rem);animation:fade-up .8s var(--e-out) .35s both;
  white-space:pre-line;line-height:1.8;position:relative;z-index:2;max-width:min(330px,88vw);}

/* ── INVITE CARD ────────────────────────────── */
.invite-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;
  padding:clamp(1.3rem,5vw,2.1rem) clamp(1.3rem,5.2vw,2.7rem);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  width:min(370px,90vw);
  box-shadow:0 0 0 1px rgba(201,169,110,.1),0 16px 50px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.05);position:relative;z-index:2;text-align:left;}
.invite-card::before{content:'';position:absolute;inset:0;border-radius:18px;
  background:linear-gradient(135deg,rgba(201,169,110,.05),transparent,rgba(232,115,138,.05));
  pointer-events:none;}
.card-label{font-size:var(--fs-tiny);letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);margin-bottom:clamp(.9rem,3.5vw,1.3rem);text-align:center;}
.card-name{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,5.8vw,2.2rem);
  font-weight:500;font-style:italic;color:var(--white);margin-bottom:.15rem;text-align:center;}
.card-concert{font-size:var(--fs-small);color:var(--gold-s);letter-spacing:.1em;
  margin-bottom:clamp(1.1rem,4vw,1.5rem);text-align:center;}
.card-divider{width:32px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,169,110,.55),transparent);
  margin:0 auto clamp(1.1rem,4vw,1.5rem);}
.card-detail{display:flex;align-items:center;gap:.7rem;margin-bottom:.7rem;}
.card-icon{width:25px;height:25px;border:1px solid rgba(201,169,110,.22);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.74rem;flex-shrink:0;}
.card-text{font-size:var(--fs-small);color:var(--dim);letter-spacing:.04em;line-height:1.45;}
.card-note{margin-top:clamp(1.1rem,4vw,1.4rem);padding-top:clamp(.9rem,3.3vw,1.2rem);
  border-top:1px solid rgba(255,255,255,.07);font-family:'Playfair Display',serif;
  font-size:clamp(.92rem,3.6vw,1.02rem);font-style:italic;color:var(--rose-s);
  line-height:1.65;text-align:center;}

/* ── ANIMATIONS ─────────────────────────────── */
@keyframes fade-up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes flash{0%{background:rgba(255,255,255,0)}28%{background:rgba(255,220,175,.16)}100%{background:rgba(255,255,255,0)}}
.flash-overlay{position:fixed;inset:0;pointer-events:none;z-index:290;animation:flash .85s ease forwards;}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--e-out),transform .8s var(--e-out);}
.reveal.in-view{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
@media(max-width:360px){.btn{padding:.76rem 1.2rem;font-size:.66rem;letter-spacing:.17em}.hero-title{font-size:2.1rem}.cd-num{font-size:1.5rem}}
@media(max-height:500px) and (orientation:landscape){
  #secret-screen{justify-content:flex-start;overflow-y:auto;padding-top:.9rem}
  .secret-lock{margin-bottom:.8rem;width:38px;height:38px}
  .secret-sub{margin-bottom:.9rem}
  #hero{justify-content:flex-start;padding-top:1rem}
  .banner-wrap{width:min(200px,38vw);margin-bottom:.8rem}
  .hero-title{font-size:1.85rem}
  .hero-sub,.ornament{margin-bottom:.9rem}
  #celebration{overflow-y:auto}
  .celeb-inner{justify-content:flex-start;padding-top:1rem}}
@media(min-width:600px){.cd-num{max-width:74px}.banner-wrap{width:min(380px,70vw)}}
</style>
</head>
<body>
<canvas id="particles-canvas" aria-hidden="true"></canvas>

<!-- SECRET SCREEN -->
<section id="secret-screen" role="region" aria-label="Секретное приглашение">
  <div class="secret-glow" aria-hidden="true"></div>
  <div class="secret-lock" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="12" y="28" width="40" height="28" rx="8" stroke="#c9a96e" stroke-width="1.4" fill="rgba(201,169,110,.06)"/>
      <path d="M20 28V20a12 12 0 0 1 24 0v8" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="32" cy="42" r="4" fill="#c9a96e" opacity=".8"/>
      <line x1="32" y1="46" x2="32" y2="52" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </div>
  <p class="secret-eyebrow">Бегім үшін</p>
  <h1 class="secret-title">Шақырту сәлден кейін <br>ашылады</h1>
  <p class="secret-sub">Ерекше кеш сені күтеді</p>
  <div id="countdown" role="timer" aria-live="polite">
    <div class="cd-item"><div class="cd-num" id="cd-days">--</div><span class="cd-label">күн</span></div>
    <span class="cd-sep" aria-hidden="true">:</span>
    <div class="cd-item"><div class="cd-num" id="cd-hours">--</div><span class="cd-label">сағат</span></div>
    <span class="cd-sep" aria-hidden="true">:</span>
    <div class="cd-item"><div class="cd-num" id="cd-mins">--</div><span class="cd-label">минут</span></div>
    <span class="cd-sep" aria-hidden="true">:</span>
    <div class="cd-item"><div class="cd-num" id="cd-secs">--</div><span class="cd-label">секунд</span></div>
  </div>
</section>

<!-- MAIN CONTENT -->
<main id="main-content">
  <section id="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="banner-wrap"><div class="banner-frame"><img id="banner-img" alt="Kairat Nurtas — Almaty Solo Concert" loading="lazy"></div></div>
    <p class="hero-eyebrow">Арнайы шақырту · Бегім үшін</p>
    <h2 class="hero-title">
      <em id="hero-title-name"></em>
      <span class="line-rose">концертке кеттік</span>
    </h2>
    <p class="hero-sub">Бұл кеш өте әсерлі болмақ.<br>Музыка, сен және мен.</p>
    <div class="ornament" aria-hidden="true">
      <div class="ornament-line"></div><div class="ornament-diamond"></div><div class="ornament-line r"></div>
    </div>
    <p class="ask-label">Гоу маа?</p>
    <div class="btn-wrap">
      <button class="btn btn-yes" id="btn-yes">Иә</button>
      <button class="btn btn-no"  id="btn-no">Жоқ</button>
    </div>
  </section>
</main>

<!-- CELEBRATION -->
<div id="celebration" role="dialog" aria-modal="true">
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>
  <div class="celeb-glow" aria-hidden="true"></div>
  <div class="celeb-inner">
    <div class="celeb-hearts" aria-hidden="true">🤍✨🤍</div>
    <h2 class="celeb-title" id="celeb-title"></h2>
    <p  class="celeb-sub"   id="celeb-sub"></p>
    <div class="invite-card reveal" id="invite-card">
      <p class="card-label">Арнайы шақырту</p>
      <p class="card-name"    id="card-name"></p>
      <p class="card-concert" id="card-concert"></p>
      <div class="card-divider"></div>
      <div class="card-detail"><div class="card-icon">📅</div><span class="card-text" id="card-date"></span></div>
      <div class="card-detail"><div class="card-icon">📍</div><span class="card-text" id="card-place"></span></div>
      <div class="card-detail"><div class="card-icon">🎤</div><span class="card-text">Special guest: LOBODA</span></div>
      <div class="card-detail"><div class="card-icon">✨</div><span class="card-text" id="card-dress"></span></div>
      <p class="card-note" id="card-note"></p>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('hero-title-name').textContent = GIRL_NAME + ',';
  document.getElementById('celeb-title').textContent     = YES_MESSAGE;
  document.getElementById('card-name').textContent       = GIRL_NAME;
  document.getElementById('card-concert').textContent    = CONCERT_NAME;
  document.getElementById('card-date').textContent       = CONCERT_DATE_DISPLAY;
  document.getElementById('card-place').textContent      = CONCERT_PLACE;
  document.getElementById('card-dress').textContent      = DRESS_CODE;
  document.getElementById('card-note').textContent       = INVITE_NOTE;
  document.getElementById('banner-img').src              = BANNER_IMAGE;
  initCountdown(); initParticles(); initButtons(); initScrollReveal();
});

function initCountdown() {
  // Парсим через компоненты — всегда локальное время, без UTC-бага
  const [y,mo,d]  = OPEN_DATE.split('-').map(Number);
  const [h,mi]    = OPEN_TIME.split(':').map(Number);
  const target    = new Date(y, mo-1, d, h, mi, 0, 0);

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick() {
    const diff = target - Date.now();

    // Дата ещё не наступила — показываем отсчёт
    if (diff > 0) {
      document.getElementById('cd-days').textContent  = pad(Math.floor(diff/86400000));
      document.getElementById('cd-hours').textContent = pad(Math.floor((diff%86400000)/3600000));
      document.getElementById('cd-mins').textContent  = pad(Math.floor((diff%3600000)/60000));
      document.getElementById('cd-secs').textContent  = pad(Math.floor((diff%60000)/1000));
      return;
    }

    // Время пришло — открываем один раз и останавливаем интервал
    clearInterval(timer);
    revealMain();
  }

  // Первая проверка ДО запуска интервала
  // Если дата уже прошла — сразу открываем без мелькания
  const initialDiff = target - Date.now();
  if (initialDiff <= 0) {
    revealMain();
    return;
  }

  // Иначе показываем отсчёт и запускаем таймер
  tick();
  const timer = setInterval(tick, 1000);
}

function revealMain(){
  const s=document.getElementById('secret-screen'),m=document.getElementById('main-content');
  s.style.transition='opacity .9s ease,visibility .9s ease';s.style.opacity='0';s.style.visibility='hidden';
  setTimeout(()=>{s.style.display='none';m.classList.add('visible');},900);
}

function initParticles(){
  const cv=document.getElementById('particles-canvas'),ctx=cv.getContext('2d');
  const C=['rgba(201,169,110,','rgba(232,115,138,','rgba(255,255,255,'];
  let W,H,pts=[];
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  function mk(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,
    dx:(Math.random()-.5)*.27,dy:-(Math.random()*.42+.1),a:Math.random(),
    da:(Math.random()-.5)*.003,c:C[Math.floor(Math.random()*C.length)]}}
  function init(){resize();pts=Array.from({length:65},mk);}
  (function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.a+=p.da;
      if(p.a<0||p.a>1)p.da*=-1;if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c+Math.max(0,Math.min(1,p.a)).toFixed(2)+')';ctx.fill();});
    requestAnimationFrame(draw);
  })();
  init();window.addEventListener('resize',init);
}

function initButtons(){
  const yes=document.getElementById('btn-yes'),no=document.getElementById('btn-no');
  let fled=false;
  function flee(cx,cy){
    if(fled)return;
    const rect=no.getBoundingClientRect();
    const vw=window.innerWidth,vh=window.innerHeight,bw=rect.width,bh=rect.height;
    if(!no.classList.contains('fleeing')){
      no.classList.add('fleeing');no.style.width=bw+'px';
      no.style.left=rect.left+'px';no.style.top=rect.top+'px';}
    let bX=0,bY=0,bD=0;
    for(let i=0;i<14;i++){
      const tx=Math.random()*(vw-bw-16)+8,ty=Math.random()*(vh-bh-16)+8;
      const d=Math.hypot(tx+bw/2-cx,ty+bh/2-cy);if(d>bD){bD=d;bX=tx;bY=ty;}}
    requestAnimationFrame(()=>{no.style.left=bX+'px';no.style.top=bY+'px';});
  }
  no.addEventListener('mouseenter',e=>flee(e.clientX,e.clientY));
  no.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];flee(t.clientX,t.clientY);},{passive:false});
  function celebrate(){
    if(fled)return;fled=true;
    const fl=document.createElement('div');fl.className='flash-overlay';document.body.appendChild(fl);
    setTimeout(()=>fl.remove(),950);
    const cel=document.getElementById('celebration');cel.classList.add('active');cel.scrollTop=0;
    startConfetti();
    setTimeout(()=>document.getElementById('invite-card').classList.add('in-view'),650);
  }
  yes.addEventListener('click',celebrate);
  yes.addEventListener('touchend',e=>{e.preventDefault();celebrate();},{passive:false});
}

function startConfetti(){
  const cv=document.getElementById('confetti-canvas'),ctx=cv.getContext('2d');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const COLS=['#c9a96e','#e8cfa0','#e8738a','#f4a7b5','#fff','#ffe4a0'],SH=['rect','circle','heart'];
  const pieces=Array.from({length:150},()=>({
    x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,
    w:Math.random()*9+4,h:Math.random()*5+3,r:Math.random()*Math.PI*2,
    dr:(Math.random()-.5)*.11,dx:(Math.random()-.5)*2.2,dy:Math.random()*3.2+1.4,
    col:COLS[Math.floor(Math.random()*COLS.length)],sh:SH[Math.floor(Math.random()*SH.length)]}));
  function heart(c,x,y,s){c.beginPath();c.moveTo(x,y+s/4);
    c.bezierCurveTo(x,y,x-s/2,y,x-s/2,y+s/4);c.bezierCurveTo(x-s/2,y+s/2,x,y+s*.75,x,y+s);
    c.bezierCurveTo(x,y+s*.75,x+s/2,y+s/2,x+s/2,y+s/4);c.bezierCurveTo(x+s/2,y,x,y,x,y+s/4);c.closePath();}
  let fr=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);let alive=false;
    pieces.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.r+=p.dr;if(p.y>cv.height+20)return;alive=true;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.col;
      if(p.sh==='rect')ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      else if(p.sh==='circle'){ctx.beginPath();ctx.arc(0,0,p.w/2,0,Math.PI*2);ctx.fill();}
      else{heart(ctx,-p.w/2,-p.w/2,p.w);ctx.fill();}ctx.restore();});
    fr++;if(alive||fr<220)requestAnimationFrame(loop);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

function initScrollReveal(){
  if(!window.IntersectionObserver){document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in-view'));return;}
  const obs=new IntersectionObserver((e)=>e.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');obs.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}
</script>
</body>
</html>
